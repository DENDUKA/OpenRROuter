name: Build Images

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'OpenRussiaRouter.sln'
      - 'NuGet.Config'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/build-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'OpenRussiaRouter.sln'
      - 'NuGet.Config'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/build-deploy.yml'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: denduka

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore OpenRussiaRouter.sln --configfile NuGet.Config
        shell: bash

      - name: Build
        run: dotnet build OpenRussiaRouter.sln --no-restore -c Release
        shell: bash

      - name: Detect changed services
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi

          changed_files="$(git diff --name-only "$base" "${{ github.sha }}")"

          api_gateway=false auth_service=false billing_service=false
          control_plane=false webapp=false all_services=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              .github/workflows/build-deploy.yml|OpenRussiaRouter.sln|NuGet.Config|global.json|Directory.Build.props|Directory.Packages.props|src/OpenRussiaRouter.BuildingBlocks/*|src/OpenRussiaRouter.Contracts/*)
                all_services=true ;;
              src/OpenRussiaRouter.ApiGateway/*)   api_gateway=true ;;
              src/OpenRussiaRouter.AuthService/*)   auth_service=true ;;
              src/OpenRussiaRouter.BillingService/*) billing_service=true ;;
              src/OpenRussiaRouter.ControlPlane/*)  control_plane=true ;;
              src/OpenRussiaRouter.WebApp/*)        webapp=true ;;
            esac
          done <<< "$changed_files"

          if [[ "$all_services" == "true" ]]; then
            api_gateway=true; auth_service=true; billing_service=true
            control_plane=true; webapp=true
          fi

          { echo "api_gateway=$api_gateway"
            echo "auth_service=$auth_service"
            echo "billing_service=$billing_service"
            echo "control_plane=$control_plane"
            echo "webapp=$webapp"; } >> "$GITHUB_OUTPUT"

    outputs:
      api_gateway: ${{ steps.changes.outputs.api_gateway }}
      auth_service: ${{ steps.changes.outputs.auth_service }}
      billing_service: ${{ steps.changes.outputs.billing_service }}
      control_plane: ${{ steps.changes.outputs.control_plane }}
      webapp: ${{ steps.changes.outputs.webapp }}

  build-image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            output_key: api_gateway
            dockerfile: ./src/OpenRussiaRouter.ApiGateway/Dockerfile
          - service: auth-service
            output_key: auth_service
            dockerfile: ./src/OpenRussiaRouter.AuthService/Dockerfile
          - service: billing-service
            output_key: billing_service
            dockerfile: ./src/OpenRussiaRouter.BillingService/Dockerfile
          - service: control-plane
            output_key: control_plane
            dockerfile: ./src/OpenRussiaRouter.ControlPlane/Dockerfile
          - service: webapp
            output_key: webapp
            dockerfile: ./src/OpenRussiaRouter.WebApp/Dockerfile

    steps:
      - uses: actions/checkout@v5

      - name: Check if service changed
        id: check
        shell: bash
        run: |
          case "${{ matrix.output_key }}" in
            api_gateway)     echo "changed=${{ needs.test.outputs.api_gateway }}" >> "$GITHUB_OUTPUT" ;;
            auth_service)    echo "changed=${{ needs.test.outputs.auth_service }}" >> "$GITHUB_OUTPUT" ;;
            billing_service) echo "changed=${{ needs.test.outputs.billing_service }}" >> "$GITHUB_OUTPUT" ;;
            control_plane)   echo "changed=${{ needs.test.outputs.control_plane }}" >> "$GITHUB_OUTPUT" ;;
            webapp)          echo "changed=${{ needs.test.outputs.webapp }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Login to GHCR
        if: steps.check.outputs.changed == 'true'
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3.10.0
        with:
          driver: docker-container

      - name: Build and push
        if: steps.check.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}:dev-latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
