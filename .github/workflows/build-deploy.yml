name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  OWNER: openrussiarouter

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orr
          POSTGRES_MULTIPLE_DATABASES: orr_auth,orr_billing,orr_control
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore OpenRussiaRouter.sln --configfile NuGet.Config
        shell: bash

      - name: Build
        run: dotnet build OpenRussiaRouter.sln --no-restore -c Release
        shell: bash

      - name: Test
        run: dotnet test OpenRussiaRouter.sln --no-build -c Release
        shell: bash
        env:
          ORR_AUTH_POSTGRES_TEST_CONNECTION: Host=localhost;Port=5432;Database=orr_auth;Username=orr;Password=testpass
          ORR_BILLING_POSTGRES_TEST_CONNECTION: Host=localhost;Port=5432;Database=orr_billing;Username=orr;Password=testpass
          ORR_CONTROL_POSTGRES_TEST_CONNECTION: Host=localhost;Port=5432;Database=orr_control;Username=orr;Password=testpass

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and push ApiGateway
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/OpenRussiaRouter.ApiGateway/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/api-gateway:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/api-gateway:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push AuthService
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/OpenRussiaRouter.AuthService/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/auth-service:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/auth-service:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push BillingService
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/OpenRussiaRouter.BillingService/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/billing-service:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/billing-service:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ControlPlane
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/OpenRussiaRouter.ControlPlane/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/control-plane:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/control-plane:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push WebApp
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/OpenRussiaRouter.WebApp/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/webapp:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/webapp:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Infra Manifests
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          KUSTOMIZATION="infra/kustomize/overlays/dev/kustomization.yaml"
          TAG="sha-${{ github.sha }}"
          IMAGES=(
            "${{ env.REGISTRY }}/${{ env.OWNER }}/api-gateway"
            "${{ env.REGISTRY }}/${{ env.OWNER }}/auth-service"
            "${{ env.REGISTRY }}/${{ env.OWNER }}/billing-service"
            "${{ env.REGISTRY }}/${{ env.OWNER }}/control-plane"
            "${{ env.REGISTRY }}/${{ env.OWNER }}/webapp"
          )

          python - "$KUSTOMIZATION" "$TAG" "${IMAGES[@]}" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          tag = sys.argv[2]
          images = set(sys.argv[3:])
          lines = path.read_text(encoding="utf-8").splitlines()

          current = None
          for index, line in enumerate(lines):
              stripped = line.strip()
              if stripped.startswith("- name: "):
                  current = stripped.removeprefix("- name: ")
              elif stripped.startswith("newTag: ") and current in images:
                  indent = line[: len(line) - len(line.lstrip())]
                  lines[index] = f"{indent}newTag: {tag}"

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
        shell: bash

      - name: Commit and Push Changes
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add infra/
          git diff --staged --quiet && exit 0
          git commit -m "ci: update image tags to sha-${{ github.sha }}"
          git push
