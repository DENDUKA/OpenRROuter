name: Build Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  OWNER: denduka

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orr
          POSTGRES_MULTIPLE_DATABASES: orr_auth,orr_billing,orr_control
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Detect changed services
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi

          changed_files="$(git diff --name-only "$base" "${{ github.sha }}")"
          printf '%s\n' "$changed_files"

          api_gateway=false
          auth_service=false
          billing_service=false
          control_plane=false
          webapp=false
          all_services=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            case "$file" in
              .github/workflows/build-deploy.yml|OpenRussiaRouter.sln|NuGet.Config|global.json|Directory.Build.props|Directory.Packages.props|src/OpenRussiaRouter.BuildingBlocks/*|src/OpenRussiaRouter.Contracts/*)
                all_services=true
                ;;
              src/OpenRussiaRouter.ApiGateway/*)
                api_gateway=true
                ;;
              src/OpenRussiaRouter.AuthService/*)
                auth_service=true
                ;;
              src/OpenRussiaRouter.BillingService/*)
                billing_service=true
                ;;
              src/OpenRussiaRouter.ControlPlane/*)
                control_plane=true
                ;;
              src/OpenRussiaRouter.WebApp/*)
                webapp=true
                ;;
            esac
          done <<< "$changed_files"

          if [[ "$all_services" == "true" ]]; then
            api_gateway=true
            auth_service=true
            billing_service=true
            control_plane=true
            webapp=true
          fi

          {
            echo "api_gateway=$api_gateway"
            echo "auth_service=$auth_service"
            echo "billing_service=$billing_service"
            echo "control_plane=$control_plane"
            echo "webapp=$webapp"
          } >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore OpenRussiaRouter.sln --configfile NuGet.Config
        shell: bash

      - name: Build
        run: dotnet build OpenRussiaRouter.sln --no-restore -c Release
        shell: bash

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build ApiGateway image
        if: steps.changes.outputs.api_gateway == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/OpenRussiaRouter.ApiGateway/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/api-gateway:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/api-gateway:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build AuthService image
        if: steps.changes.outputs.auth_service == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/OpenRussiaRouter.AuthService/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/auth-service:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/auth-service:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build BillingService image
        if: steps.changes.outputs.billing_service == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/OpenRussiaRouter.BillingService/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/billing-service:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/billing-service:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ControlPlane image
        if: steps.changes.outputs.control_plane == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/OpenRussiaRouter.ControlPlane/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/control-plane:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/control-plane:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build WebApp image
        if: steps.changes.outputs.webapp == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/OpenRussiaRouter.WebApp/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/webapp:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/webapp:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
