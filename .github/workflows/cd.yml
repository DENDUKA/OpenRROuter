name: Deploy

on:
  workflow_run:
    workflows: ["Build Images"]
    types: [completed]
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Images published
        run: |
          echo "Build ${{ github.event.workflow_run.head_sha }} completed."
          echo "ArgoCD Image Updater will detect new digests within 2 minutes."
