name: Telegram bot — validate and publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tg_bot/**'
      - 'deploy/compose/update-tg-bot.sh'
      - 'deploy/compose/update-prod.sh'
      - '.github/workflows/tg-bot.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tg_bot/**'
      - 'deploy/compose/update-tg-bot.sh'
      - 'deploy/compose/update-prod.sh'
      - '.github/workflows/tg-bot.yml'

concurrency:
  group: tg-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tg_bot/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tg_bot
      - run: npm run typecheck && npm test && npm run build
        working-directory: tg_bot
      - run: bash -n deploy/compose/update-prod.sh deploy/compose/update-tg-bot.sh
      - run: bash tg_bot/test-deploy.sh
      - name: Validate Compose without production secrets
        run: TG_BOT_ENV_FILE=/dev/null docker compose -p rawrter-tg-bot -f tg_bot/compose.yml config --quiet
      - name: Build container (also on PR)
        run: docker build -t rawrter-tg-bot:ci tg_bot

  publish:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_PAT && 'denduka' || github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3.10.0
      - uses: docker/build-push-action@v6
        with:
          context: ./tg_bot
          push: true
          tags: |
            ghcr.io/denduka/rawrter-tg-bot:sha-${{ github.sha }}
            ghcr.io/denduka/rawrter-tg-bot:dev-latest
          cache-from: type=gha,scope=tg-bot
          cache-to: type=gha,mode=max,scope=tg-bot
