name: orr

# PRODUCTION compose for host 201.51.6.246 (zetalink VDS). ORR-only — NO f9router
# (9R runs on the dev box; this server serves only the .NET stack). Adds a Caddy
# reverse proxy with automatic HTTPS in front of the WebApp (cabinet + payment webhook).
#
# This file is the single source of truth for the prod box: deploy-prod.sh / update-prod.sh
# copy it to /opt/orr/compose.yml on every run, so the box never hand-diverges from git.
# The dev single-host topology (with f9router) stays in compose.yml.

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: openrussiarouter
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openrussiarouter"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 1.0

  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data
    mem_limit: 1g
    cpus: 1.0

  auth-service:
    build:
      context: ./app
      dockerfile: src/OpenRussiaRouter.AuthService/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # gRPC stays on 8080 as cleartext HTTP/2; 8082 is an HTTP/1.1 side door for
      # /metrics and /health. Prometheus cannot scrape h2c — with a single Http2-only
      # endpoint every scrape came back 400 Bad Request.
      Kestrel__Endpoints__Grpc__Url: "http://+:8080"
      Kestrel__Endpoints__Grpc__Protocols: "Http2"
      Kestrel__Endpoints__Metrics__Url: "http://+:8082"
      Kestrel__Endpoints__Metrics__Protocols: "Http1"
      ConnectionStrings__AuthDb: "Host=postgres;Port=5432;Database=openrussiarouter;Username=postgres;Password=${POSTGRES_PASSWORD};Pooling=true;MinPoolSize=5;MaxPoolSize=50;Connection Idle Lifetime=300"
      Seq__Url: "http://seq:80"
      AuthOptions__InitialAdminEmail: "${INITIAL_ADMIN_EMAIL}"
      AuthOptions__InitialAdminPassword: "${INITIAL_ADMIN_PASSWORD}"
      # Product analytics — pseudonymized, own DB. IdentitySalt is the HMAC pepper: it MUST stay
      # stable for this box across restarts, rotating it invalidates every existing distinct_id.
      ProductAnalytics__Enabled: "true"
      ProductAnalytics__Provider: "Postgres"
      ProductAnalytics__ConnectionString: "Host=postgres;Port=5432;Database=orr_analytics;Username=postgres;Password=${POSTGRES_PASSWORD};Pooling=true;MinPoolSize=2;MaxPoolSize=20"
      ProductAnalytics__IdentitySalt: "${PRODUCT_ANALYTICS_IDENTITY_SALT}"
      ProductAnalytics__Environment: "production"
    mem_limit: 512m
    cpus: 0.75

  billing-service:
    build:
      context: ./app
      dockerfile: src/OpenRussiaRouter.BillingService/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # gRPC stays on 8080 as cleartext HTTP/2; 8082 is an HTTP/1.1 side door for
      # /metrics and /health. Prometheus cannot scrape h2c — with a single Http2-only
      # endpoint every scrape came back 400 Bad Request.
      Kestrel__Endpoints__Grpc__Url: "http://+:8080"
      Kestrel__Endpoints__Grpc__Protocols: "Http2"
      Kestrel__Endpoints__Metrics__Url: "http://+:8082"
      Kestrel__Endpoints__Metrics__Protocols: "Http1"
      ConnectionStrings__BillingDb: "Host=postgres;Port=5432;Database=openrussiarouter;Username=postgres;Password=${POSTGRES_PASSWORD};Pooling=true;MinPoolSize=5;MaxPoolSize=50;Connection Idle Lifetime=300"
      ServiceAuth__Tokens__apigateway: "${S2S_API_GATEWAY_TOKEN}"
      ServiceAuth__Tokens__webappadmin: "${S2S_WEBAPP_TOKEN}"
      Seq__Url: "http://seq:80"
      # BillingService owns the analytics migration: it creates orr_analytics + analytics.events
      # on startup whenever ProductAnalytics:ConnectionString is set.
      ProductAnalytics__Enabled: "true"
      ProductAnalytics__Provider: "Postgres"
      ProductAnalytics__ConnectionString: "Host=postgres;Port=5432;Database=orr_analytics;Username=postgres;Password=${POSTGRES_PASSWORD};Pooling=true;MinPoolSize=2;MaxPoolSize=20"
      ProductAnalytics__IdentitySalt: "${PRODUCT_ANALYTICS_IDENTITY_SALT}"
      ProductAnalytics__Environment: "production"
    mem_limit: 512m
    cpus: 0.75

  control-plane:
    build:
      context: ./app
      dockerfile: src/OpenRussiaRouter.ControlPlane/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # gRPC stays on 8080 as cleartext HTTP/2; 8082 is an HTTP/1.1 side door for
      # /metrics and /health. Prometheus cannot scrape h2c — with a single Http2-only
      # endpoint every scrape came back 400 Bad Request.
      Kestrel__Endpoints__Grpc__Url: "http://+:8080"
      Kestrel__Endpoints__Grpc__Protocols: "Http2"
      Kestrel__Endpoints__Metrics__Url: "http://+:8082"
      Kestrel__Endpoints__Metrics__Protocols: "Http1"
      ConnectionStrings__ControlPlaneDb: "Host=postgres;Port=5432;Database=openrussiarouter;Username=postgres;Password=${POSTGRES_PASSWORD};Pooling=true;MinPoolSize=5;MaxPoolSize=50;Connection Idle Lifetime=300"
      GrpcServices__Auth: "http://auth-service:8080"
      GrpcServices__Collector: "http://collector:8081"
      Seq__Url: "http://seq:80"
      RouterHealthChecks__HealthPath: "/api/health"
    mem_limit: 512m
    cpus: 0.75

  content-service:
    build:
      context: ./app
      dockerfile: src/OpenRussiaRouter.ContentService/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5007:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # gRPC stays on 8080 as cleartext HTTP/2; 8082 is an HTTP/1.1 side door for
      # /metrics and /health. Prometheus cannot scrape h2c — with a single Http2-only
      # endpoint every scrape came back 400 Bad Request.
      Kestrel__Endpoints__Grpc__Url: "http://+:8080"
      Kestrel__Endpoints__Grpc__Protocols: "Http2"
      Kestrel__Endpoints__Metrics__Url: "http://+:8082"
      Kestrel__Endpoints__Metrics__Protocols: "Http1"
      ConnectionStrings__ContentDb: "Host=postgres;Port=5432;Database=openrussiarouter;Username=postgres;Password=${POSTGRES_PASSWORD};Pooling=true;MinPoolSize=5;MaxPoolSize=50;Connection Idle Lifetime=300"
      ServiceAuth__Tokens__webappadmin: "${S2S_WEBAPP_TOKEN}"
      Seq__Url: "http://seq:80"
    mem_limit: 512m
    cpus: 0.75

  collector:
    build:
      context: ./app
      dockerfile: src/OpenRussiaRouter.CollectorService/Dockerfile
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_started
    ports:
      - "5005:8081"
      - "5006:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Kestrel__Endpoints__Http__Url: "http://+:8080"
      Kestrel__Endpoints__Http__Protocols: "Http1"
      Kestrel__Endpoints__Grpc__Url: "http://+:8081"
      Kestrel__Endpoints__Grpc__Protocols: "Http2"
      GrpcServices__Billing: "http://billing-service:8080"
      GrpcServices__ControlPlane: "http://control-plane:8080"
      Seq__Url: "http://seq:80"
    mem_limit: 512m
    cpus: 0.75

  api-gateway:
    build:
      context: ./app
      dockerfile: src/OpenRussiaRouter.ApiGateway/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      billing-service:
        condition: service_started
      control-plane:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      GrpcServices__Auth: "http://auth-service:8080"
      GrpcServices__Billing: "http://billing-service:8080"
      GrpcServices__ControlPlane: "http://control-plane:8080"
      ServiceAuth__BillingCaller: "apigateway"
      ServiceAuth__BillingToken: "${S2S_API_GATEWAY_TOKEN}"
      # ApiGateway runs the gateway (usage_outbox) SQL migration on startup — it needs the
      # shared Postgres, else it defaults to appsettings' Host=localhost and crash-loops.
      ConnectionStrings__GatewayDb: "Host=postgres;Port=5432;Database=openrussiarouter;Username=postgres;Password=${POSTGRES_PASSWORD};Pooling=true;MinPoolSize=5;MaxPoolSize=50;Connection Idle Lifetime=300"
      Seq__Url: "http://seq:80"
    mem_limit: 512m
    cpus: 0.75

  webapp:
    build:
      context: ./app
      dockerfile: src/OpenRussiaRouter.WebApp/Dockerfile
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
      billing-service:
        condition: service_started
      control-plane:
        condition: service_started
      collector:
        condition: service_started
      content-service:
        condition: service_started
    ports:
      - "3000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      GrpcServices__Auth: "http://auth-service:8080"
      GrpcServices__Billing: "http://billing-service:8080"
      GrpcServices__ControlPlane: "http://control-plane:8080"
      GrpcServices__Collector: "http://collector:8081"
      GrpcServices__Content: "http://content-service:8080"
      ServiceAuth__BillingCaller: "webappadmin"
      ServiceAuth__BillingToken: "${S2S_WEBAPP_TOKEN}"
      # Canonical site origin for crawler-facing SEO metadata (canonical, og:url, og:image,
      # sitemap.xml <loc>). The admin-configured API base points at api.<domain> and must never
      # leak into the sitemap/canonical tags.
      PublicSiteBaseUrl: "https://${RWT_PUBLIC_DOMAIN}"
      Seq__Url: "http://seq:80"
      # Brevo SMTP credentials — from /opt/orr/.env (see .env.example). Non-secret Email
      # config (host/port) ships in appsettings.json.
      Email__SmtpUsername: "${EMAIL_SMTP_USERNAME}"
      Email__SmtpPassword: "${EMAIL_SMTP_PASSWORD}"
      # Grafana alert relay: /internal/alerts/grafana emails via the Brevo HTTP path. Disabled
      # (503) unless both are set. Token is shared with the grafana container's contact point.
      Alerting__WebhookToken: "${ALERT_WEBHOOK_TOKEN}"
      Alerting__EmailTo: "${ALERT_EMAIL_TO}"
      # Branded prod sender. Overrides appsettings so the box sends from the service's own
      # domain even on an image built before the appsettings default was updated (no rebuild).
      # openrussiarouter.com MUST be SPF/DKIM-authenticated in Brevo before this sends mail.
      Email__SenderAddress: "noreply@openrussiarouter.com"
      # This host blocks ALL outbound SMTP ports (25/465/587/2525), so prod sends via Brevo's
      # HTTP API over 443. BREVO_API_KEY (xkeysib-…) is a secret from /opt/orr/.env.
      Email__Transport: "${EMAIL_TRANSPORT:-smtp}"
      Email__BrevoApiKey: "${BREVO_API_KEY:-}"
      # Behind Caddy (TLS termination): trust X-Forwarded-Proto so ASP.NET knows the
      # original request arrived over HTTPS (correct scheme in links, Secure cookies).
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # Payments (Rollypay СБП). Blank ActiveProvider disables payments (fail-safe); set it
      # to "rollypay" only once ApiKey + SigningSecret are filled in .env from the касса UI,
      # and the webhook https://${RWT_PUBLIC_DOMAIN}/webhook/rollypay is registered there.
      Payments__ActiveProvider: "${PAYMENTS_ACTIVE_PROVIDER:-}"
      Payments__Rollypay__ApiKey: "${ROLLYPAY_API_KEY:-}"
      Payments__Rollypay__SigningSecret: "${ROLLYPAY_SIGNING_SECRET:-}"
      Payments__Rollypay__SuccessRedirectUrl: "https://${RWT_PUBLIC_DOMAIN}/workspace/credits?topup=success"
      Payments__Rollypay__FailRedirectUrl: "https://${RWT_PUBLIC_DOMAIN}/workspace/credits?topup=fail"
      # Sandbox: same касса, same keys, no real money. WebApp refuses to start with this on in
      # Production — a test payment is free but still credits real balance.
      Payments__Rollypay__TestMode: "${ROLLYPAY_TEST_MODE:-false}"
      # Yandex Pay sandbox — card-only alternative for admin testing. Disabled by default;
      # enable via YANDEX_PAY_ENABLED=true + YANDEX_PAY_MERCHANT_ID in .env.
      Payments__YandexPay__Enabled: "${YANDEX_PAY_ENABLED:-false}"
      Payments__YandexPay__Sandbox: "${YANDEX_PAY_SANDBOX:-true}"
      Payments__YandexPay__MerchantId: "${YANDEX_PAY_MERCHANT_ID:-}"
      Payments__YandexPay__SuccessRedirectUrl: "https://${RWT_PUBLIC_DOMAIN}/workspace/credits?topup=success"
      Payments__YandexPay__FailRedirectUrl: "https://${RWT_PUBLIC_DOMAIN}/workspace/credits?topup=fail"
      # Product analytics sink (analytics.events). Same DB and same IdentitySalt as
      # auth/billing: the salt keys distinct_id, so a different value would orphan the
      # existing pseudonyms. Site traffic itself is measured by Yandex Metrika.
      ProductAnalytics__Enabled: "true"
      ProductAnalytics__Provider: "Postgres"
      ProductAnalytics__ConnectionString: "Host=postgres;Port=5432;Database=orr_analytics;Username=postgres;Password=${POSTGRES_PASSWORD};Pooling=true;MinPoolSize=2;MaxPoolSize=20"
      ProductAnalytics__IdentitySalt: "${PRODUCT_ANALYTICS_IDENTITY_SALT}"
      ProductAnalytics__Environment: "production"
      # Web-analytics tags in the shared layout: Yandex Metrika counter and GA4 gtag.
      # Not secrets (they are emitted into public HTML); empty values disable the
      # corresponding snippet and keep CSP strict.
      Analytics__GoogleTagId: "G-BDD3DYVCLL"
      Analytics__YandexCounterId: "111420552"
      # Yandex OAuth: login + signup via Yandex account. Enables the "Sign in with Yandex"
      # button on /login and /signup. Empty values hide the button (OAuth disabled).
      Yandex__ClientId: "${YANDEX_CLIENT_ID:-}"
      Yandex__ClientSecret: "${YANDEX_CLIENT_SECRET:-}"
      # Data Protection key ring: persisted to a Docker volume so the antiforgery tokens
      # and cookie-auth session tickets survive container restarts. Without this every
      # restart silently mints a new key ring, logged-in users are kicked out, and stale
      # antiforgery cookies throw AntiforgeryValidationException ("key not found").
      DataProtection__KeyRingPath: "/var/lib/orr/dataprotection-keys"
    volumes:
      - webapp_keys:/var/lib/orr/dataprotection-keys
    mem_limit: 512m
    cpus: 0.75

  # ---------------------------------------------------------------------------
  # VitePress-документация. Раздаётся nginx'ом под https://rawrter.com/docs/
  # (см. docs-site/Dockerfile + nginx.conf и блок @docs в Caddyfile). Не публикует
  # порт наружу — Caddy проксирует по внутренней сети илиr_default.
  # ---------------------------------------------------------------------------
  docs:
    build:
      context: ./app/docs-site
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      webapp:
        condition: service_started
      grafana:
        condition: service_started
      docs:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      RWT_PUBLIC_DOMAIN: "${RWT_PUBLIC_DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL:-nusferatus64@gmail.com}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    cpus: 0.5

  # ---------------------------------------------------------------------------
  # Monitoring. Both are bound to 127.0.0.1 only — reach them over an SSH tunnel:
  #   ssh -i .deploy/orr_prod_vps_access -L 3001:127.0.0.1:3001 root@201.51.6.246
  # Do NOT publish them on 0.0.0.0: Grafana holds read access to the billing DB.
  # ---------------------------------------------------------------------------

  prometheus:
    # quay.io, not docker.io/prom/prometheus: the box hits Docker Hub's anonymous pull
    # limit (429) and the deploy dies at `compose up`. Quay is the project's own mirror.
    image: quay.io/prometheus/prometheus:v2.51.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 512m
    cpus: 0.5

  grafana:
    image: grafana/grafana:10.4.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Business Text — панель «Ноды, провайдеры и модели» дашборда ORR Nodes & Provider Limits.
      # Ставится при старте контейнера, нужен исходящий HTTPS. Версия запиннена: 5.5.0 — последняя,
      # поддерживающая Grafana 10.4; с 6.0.0 плагин требует Grafana 11+.
      # Версия отделяется ПРОБЕЛОМ, не '@': /run.sh передаёт запись в `grafana cli plugins
      # install` без кавычек, поэтому пробел становится вторым аргументом, а "id@version"
      # уезжает целиком как id плагина и получает 404. Entrypoint — `#!/bin/bash -e`,
      # так что этот 404 роняет контейнер в рестарт-луп.
      GF_INSTALL_PLUGINS: "marcusolsson-dynamictext-panel 5.5.0"
      # Панель строит разметку JS-шаблоном; без этого Grafana вырезает её содержимое санитайзером.
      # Безопасно ровно потому, что Grafana закрыта (анонимный доступ и регистрация выключены),
      # а содержимое панелей задаётся только provisioning-файлами из git (allowUiUpdates: false).
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
      # Exposed behind Caddy at https://<RWT_PUBLIC_DOMAIN>/grafana/ — see Caddyfile.
      # SERVE_FROM_SUB_PATH keeps the /grafana/ prefix so Grafana emits correct asset URLs.
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_DOMAIN: "${RWT_PUBLIC_DOMAIN}"
      GF_SERVER_ROOT_URL: "https://${RWT_PUBLIC_DOMAIN}/grafana/"
      # Consumed by provisioning/datasources/datasources.yml via $POSTGRES_PASSWORD.
      # Must be a real value — an empty one silently yields a password-less datasource.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      # Interpolated into provisioning/alerting/contactpoints.yaml — the token the webhook
      # sends to the WebApp relay. Must match the WebApp's Alerting__WebhookToken.
      ALERT_WEBHOOK_TOKEN: "${ALERT_WEBHOOK_TOKEN}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    mem_limit: 256m
    cpus: 0.5

volumes:
  postgres_data:
  seq_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  webapp_keys:
