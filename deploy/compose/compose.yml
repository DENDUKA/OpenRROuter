name: orr

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: openrussiarouter
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openrussiarouter"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 1.0

  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data
    mem_limit: 1g
    cpus: 1.0

  auth-service:
    build:
      context: ./app
      dockerfile: src/OpenRussiaRouter.AuthService/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Kestrel__EndpointDefaults__Protocols: "Http2"
      ConnectionStrings__AuthDb: "Host=postgres;Port=5432;Database=openrussiarouter;Username=postgres;Password=${POSTGRES_PASSWORD};Pooling=true;MinPoolSize=5;MaxPoolSize=50;Connection Idle Lifetime=300"
      Seq__Url: "http://seq:80"
      AuthOptions__InitialAdminEmail: "${INITIAL_ADMIN_EMAIL}"
      AuthOptions__InitialAdminPassword: "${INITIAL_ADMIN_PASSWORD}"
    mem_limit: 512m
    cpus: 0.75

  billing-service:
    build:
      context: ./app
      dockerfile: src/OpenRussiaRouter.BillingService/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Kestrel__EndpointDefaults__Protocols: "Http2"
      ConnectionStrings__BillingDb: "Host=postgres;Port=5432;Database=openrussiarouter;Username=postgres;Password=${POSTGRES_PASSWORD};Pooling=true;MinPoolSize=5;MaxPoolSize=50;Connection Idle Lifetime=300"
      ServiceAuth__Tokens__apigateway: "${S2S_API_GATEWAY_TOKEN}"
      ServiceAuth__Tokens__webappadmin: "${S2S_WEBAPP_TOKEN}"
      Seq__Url: "http://seq:80"
    mem_limit: 512m
    cpus: 0.75

  control-plane:
    build:
      context: ./app
      dockerfile: src/OpenRussiaRouter.ControlPlane/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Kestrel__EndpointDefaults__Protocols: "Http2"
      ConnectionStrings__ControlPlaneDb: "Host=postgres;Port=5432;Database=openrussiarouter;Username=postgres;Password=${POSTGRES_PASSWORD};Pooling=true;MinPoolSize=5;MaxPoolSize=50;Connection Idle Lifetime=300"
      GrpcServices__Auth: "http://auth-service:8080"
      GrpcServices__Collector: "http://collector:8081"
      Seq__Url: "http://seq:80"
      RouterHealthChecks__HealthPath: "/api/health"
    mem_limit: 512m
    cpus: 0.75

  content-service:
    build:
      context: ./app
      dockerfile: src/OpenRussiaRouter.ContentService/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5007:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Kestrel__EndpointDefaults__Protocols: "Http2"
      ConnectionStrings__ContentDb: "Host=postgres;Port=5432;Database=openrussiarouter;Username=postgres;Password=${POSTGRES_PASSWORD};Pooling=true;MinPoolSize=5;MaxPoolSize=50;Connection Idle Lifetime=300"
      ServiceAuth__Tokens__webappadmin: "${S2S_WEBAPP_TOKEN}"
      Seq__Url: "http://seq:80"
    mem_limit: 512m
    cpus: 0.75

  collector:
    build:
      context: ./app
      dockerfile: src/OpenRussiaRouter.CollectorService/Dockerfile
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_started
    ports:
      - "5005:8081"
      - "5006:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Kestrel__Endpoints__Http__Url: "http://+:8080"
      Kestrel__Endpoints__Http__Protocols: "Http1"
      Kestrel__Endpoints__Grpc__Url: "http://+:8081"
      Kestrel__Endpoints__Grpc__Protocols: "Http2"
      GrpcServices__Billing: "http://billing-service:8080"
      GrpcServices__ControlPlane: "http://control-plane:8080"
      Seq__Url: "http://seq:80"
    mem_limit: 512m
    cpus: 0.75

  api-gateway:
    build:
      context: ./app
      dockerfile: src/OpenRussiaRouter.ApiGateway/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      billing-service:
        condition: service_started
      control-plane:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      GrpcServices__Auth: "http://auth-service:8080"
      GrpcServices__Billing: "http://billing-service:8080"
      GrpcServices__ControlPlane: "http://control-plane:8080"
      ServiceAuth__BillingCaller: "apigateway"
      ServiceAuth__BillingToken: "${S2S_API_GATEWAY_TOKEN}"
      # ApiGateway runs the gateway (usage_outbox) SQL migration on startup — it needs Postgres,
      # else it falls back to appsettings' Host=localhost and crash-loops. Mirrors the live dev box.
      ConnectionStrings__GatewayDb: "Host=postgres;Port=5432;Database=orr_gateway;Username=postgres;Password=${POSTGRES_PASSWORD};Pooling=true;MinPoolSize=2;MaxPoolSize=20"
      Seq__Url: "http://seq:80"
    mem_limit: 512m
    cpus: 0.75

  webapp:
    build:
      context: ./app
      dockerfile: src/OpenRussiaRouter.WebApp/Dockerfile
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
      billing-service:
        condition: service_started
      control-plane:
        condition: service_started
      collector:
        condition: service_started
      content-service:
        condition: service_started
    ports:
      - "3000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      GrpcServices__Auth: "http://auth-service:8080"
      GrpcServices__Billing: "http://billing-service:8080"
      GrpcServices__ControlPlane: "http://control-plane:8080"
      GrpcServices__Collector: "http://collector:8081"
      GrpcServices__Content: "http://content-service:8080"
      ServiceAuth__BillingCaller: "webappadmin"
      ServiceAuth__BillingToken: "${S2S_WEBAPP_TOKEN}"
      Seq__Url: "http://seq:80"
      # Brevo SMTP credentials — from /opt/orr/.env (see .env.example). Non-secret Email
      # config (host/port/sender noreply@web-point.top) ships in appsettings.json.
      Email__SmtpUsername: "${EMAIL_SMTP_USERNAME}"
      Email__SmtpPassword: "${EMAIL_SMTP_PASSWORD}"
      # Data Protection key ring — persisted across restarts (see compose.prod.yml).
      DataProtection__KeyRingPath: "/var/lib/orr/dataprotection-keys"
    volumes:
      - webapp_keys:/var/lib/orr/dataprotection-keys
    mem_limit: 512m
    cpus: 0.75

  f9router:
    build:
      context: ./f9router
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "20128:20128"
    environment:
      NODE_ENV: production
      PORT: "20128"
      HOSTNAME: 0.0.0.0
      DATA_DIR: /app/data
      JWT_SECRET: ${F9_JWT_SECRET}
      INITIAL_PASSWORD: ${F9_INITIAL_PASSWORD}
      API_KEY_SECRET: ${F9_API_KEY_SECRET}
      MACHINE_ID_SALT: ${F9_MACHINE_ID_SALT}
      ROUTER_CONTROL_TOKEN: ${RWT_NODE_CONTROL_TOKEN}
      ENABLE_REQUEST_LOGS: "false"
      OBSERVABILITY_ENABLED: "true"
      AUTH_COOKIE_SECURE: "false"
      REQUIRE_API_KEY: "true"
      BASE_URL: "${F9_PUBLIC_URL:-http://localhost:20128}"
      NEXT_PUBLIC_BASE_URL: "${F9_PUBLIC_URL:-http://localhost:20128}"
      CLOUD_URL: "https://9router.com"
      NEXT_PUBLIC_CLOUD_URL: "https://9router.com"
      # Node's heap ceiling is auto-derived from mem_limit (~396 MB at 768m), and a 429
      # retry storm blew past it → "Reached heap limit" crashes ~every 12h. Pin the heap
      # explicitly at 1 GB and give the cgroup 1.5g so there's non-heap headroom under it.
      NODE_OPTIONS: "--max-old-space-size=1024"
    volumes:
      - f9router_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:20128/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    # Cap the json log: a retry storm wrote ~14k lines/min and the file had grown to 629 MB
    # unbounded. 3×50m keeps at most 150 MB on disk.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    mem_limit: 1536m
    cpus: 1.0

volumes:
  postgres_data:
  seq_data:
  f9router_data:
  webapp_keys:
