# Grafana datasources for the PROD compose box.
#
# Secrets come from the grafana container's environment ($POSTGRES_PASSWORD), which compose
# feeds from the gitignored /opt/orr/.env. Never inline the password here — this file IS in git.
#
# NOTE: the previous hand-rolled setup hardcoded the password because the grafana service had
# `POSTGRES_PASSWORD: ""` in its environment, so `$POSTGRES_PASSWORD` expanded to nothing and
# looked broken. Grafana's provisioning DOES interpolate $VAR / ${VAR}; the variable just has
# to actually be set on the container.

apiVersion: 1

datasources:
  # Product analytics events (pseudonymized). uid must stay `orranalytics` — the existing
  # ORR Product Analytics dashboard references it by uid.
  - name: ORR Analytics
    uid: orranalytics
    type: postgres
    access: proxy
    url: postgres:5432
    database: orr_analytics
    user: postgres
    isDefault: true
    editable: false
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      sslmode: disable
      postgresVersion: 1600

  # Main application DB — billing ledger, usage records, spend limits. Backs the Limits dashboard.
  - name: ORR Billing
    uid: orrbilling
    type: postgres
    access: proxy
    url: postgres:5432
    database: openrussiarouter
    user: postgres
    editable: false
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      sslmode: disable
      postgresVersion: 1600

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
