# Prometheus scrape config for the PROD compose box (201.51.6.246).
#
# Targets use compose service DNS on the `orr` network, port 8080 — every ORR service exposes
# OTel's Prometheus exporter at /metrics on its HTTP port (see BuildingBlocks/Metrics/
# OpenTelemetryExtensions.cs). The gRPC services listen on 8081 for gRPC but keep HTTP on 8080.
#
# scrape_protocols is pinned to PrometheusText0.0.4 on purpose: the OTel exporter emits
# OpenMetrics `# UNIT` lines that the strict OpenMetrics parser rejects. Same pin exists in
# infra/kustomize/base/infra/prometheus.yaml — do not drop it.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: production

scrape_configs:
  - job_name: openrussiarouter
    scrape_protocols: [PrometheusText0.0.4]
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:8080
          - auth-service:8080
          - billing-service:8080
          - control-plane:8080
          - collector:8080
          - webapp:8080

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
