services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: openrussiarouter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openrussiarouter"]
      interval: 5s
      timeout: 5s
      retries: 10

  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data

  auth-service:
    build:
      context: .
      dockerfile: src/OpenRussiaRouter.AuthService/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__AuthDb: "Host=postgres;Port=5432;Database=openrussiarouter;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres};Pooling=true;MinPoolSize=5;MaxPoolSize=50;Connection Idle Lifetime=300"
      Seq__Url: "http://seq:80"
      AuthOptions__InitialAdminEmail: "${INITIAL_ADMIN_EMAIL:-admin@example.com}"
      AuthOptions__InitialAdminPassword: "${INITIAL_ADMIN_PASSWORD:-StrongPassword123!}"

  billing-service:
    build:
      context: .
      dockerfile: src/OpenRussiaRouter.BillingService/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__BillingDb: "Host=postgres;Port=5432;Database=openrussiarouter;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres};Pooling=true;MinPoolSize=5;MaxPoolSize=50;Connection Idle Lifetime=300"
      ServiceAuth__Tokens__apigateway: "${S2S_API_GATEWAY_TOKEN:-dev-s2s-token-gateway-CHANGE-ME}"
      ServiceAuth__Tokens__webappadmin: "${S2S_WEBAPP_TOKEN:-dev-s2s-token-webapp-CHANGE-ME}"
      Seq__Url: "http://seq:80"

  control-plane:
    build:
      context: .
      dockerfile: src/OpenRussiaRouter.ControlPlane/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ControlPlaneDb: "Host=postgres;Port=5432;Database=openrussiarouter;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres};Pooling=true;MinPoolSize=5;MaxPoolSize=50;Connection Idle Lifetime=300"
      GrpcServices__Auth: "http://auth-service:8080"
      GrpcServices__Collector: "http://collector:8081"
      Seq__Url: "http://seq:80"

  content-service:
    build:
      context: .
      dockerfile: src/OpenRussiaRouter.ContentService/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5007:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ContentDb: "Host=postgres;Port=5432;Database=openrussiarouter;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres};Pooling=true;MinPoolSize=5;MaxPoolSize=50;Connection Idle Lifetime=300"
      ServiceAuth__Tokens__webappadmin: "${S2S_WEBAPP_TOKEN:-dev-s2s-token-webapp-CHANGE-ME}"
      Seq__Url: "http://seq:80"

  collector:
    build:
      context: .
      dockerfile: src/OpenRussiaRouter.CollectorService/Dockerfile
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_started
    ports:
      - "5005:8081"
      - "5006:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Kestrel__Endpoints__Http__Url: "http://+:8080"
      Kestrel__Endpoints__Http__Protocols: "Http1"
      Kestrel__Endpoints__Grpc__Url: "http://+:8081"
      Kestrel__Endpoints__Grpc__Protocols: "Http2"
      GrpcServices__Billing: "http://billing-service:8080"
      GrpcServices__ControlPlane: "http://control-plane:8080"
      Seq__Url: "http://seq:80"

  api-gateway:
    build:
      context: .
      dockerfile: src/OpenRussiaRouter.ApiGateway/Dockerfile
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
      billing-service:
        condition: service_started
      control-plane:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      GrpcServices__Auth: "http://auth-service:8080"
      GrpcServices__Billing: "http://billing-service:8080"
      GrpcServices__ControlPlane: "http://control-plane:8080"
      ServiceAuth__BillingCaller: "apigateway"
      ServiceAuth__BillingToken: "${S2S_API_GATEWAY_TOKEN:-dev-s2s-token-gateway-CHANGE-ME}"
      Seq__Url: "http://seq:80"

  webapp:
    build:
      context: .
      dockerfile: src/OpenRussiaRouter.WebApp/Dockerfile
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
      billing-service:
        condition: service_started
      control-plane:
        condition: service_started
      collector:
        condition: service_started
      content-service:
        condition: service_started
    ports:
      - "3000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      GrpcServices__Auth: "http://auth-service:8080"
      GrpcServices__Billing: "http://billing-service:8080"
      GrpcServices__ControlPlane: "http://control-plane:8080"
      GrpcServices__Collector: "http://collector:8081"
      GrpcServices__Content: "http://content-service:8080"
      ServiceAuth__BillingCaller: "webappadmin"
      ServiceAuth__BillingToken: "${S2S_WEBAPP_TOKEN:-dev-s2s-token-webapp-CHANGE-ME}"
      Seq__Url: "http://seq:80"
      # Brevo SMTP credentials — set on the box in a (gitignored) .env, not committed here.
      # Non-secret Email config (host/port/sender) comes from appsettings.json.
      Email__SmtpUsername: "${EMAIL_SMTP_USERNAME:-}"
      Email__SmtpPassword: "${EMAIL_SMTP_PASSWORD:-}"
      # Data Protection key ring — persisted across restarts so antiforgery tokens and
      # the cookie-auth session tickets survive. Without this every restart silently
      # mints a new key ring and kicks out logged-in users.
      DataProtection__KeyRingPath: "/var/lib/orr/dataprotection-keys"
    volumes:
      - webapp_keys:/var/lib/orr/dataprotection-keys

  prometheus:
    image: prom/prometheus:v2.51.2
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:10.4.2
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false

volumes:
  postgres_data:
  seq_data:
  prometheus_data:
  grafana_data:
  webapp_keys:
