services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: openrussiarouter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openrussiarouter"]
      interval: 5s
      timeout: 5s
      retries: 10

  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./db/migrations:/migrations:ro
    command: >
      sh -c "
        psql -h postgres -U postgres -d openrussiarouter -f /migrations/auth/001_initial.sql &&
        psql -h postgres -U postgres -d openrussiarouter -f /migrations/auth/002_seed_default_admin.sql &&
        psql -h postgres -U postgres -d openrussiarouter -f /migrations/billing/001_initial.sql &&
        psql -h postgres -U postgres -d openrussiarouter -f /migrations/billing/002_model_prices_model_id_compat.sql &&
        psql -h postgres -U postgres -d openrussiarouter -f /migrations/billing/003_model_prices_model_id_repair.sql &&
        psql -h postgres -U postgres -d openrussiarouter -f /migrations/billing/004_activity_by_token.sql &&
        psql -h postgres -U postgres -d openrussiarouter -f /migrations/control/001_initial.sql &&
        echo 'Migrations complete.'
      "

  auth-service:
    build:
      context: .
      dockerfile: src/OpenRussiaRouter.AuthService/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__AuthDb: "Host=postgres;Port=5432;Database=openrussiarouter;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres};Pooling=true;MinPoolSize=5;MaxPoolSize=50;ConnectionIdleTimeout=300"
      Seq__Url: "http://seq:80"
      AuthOptions__InitialAdminEmail: "${INITIAL_ADMIN_EMAIL:-admin@example.com}"
      AuthOptions__InitialAdminPassword: "${INITIAL_ADMIN_PASSWORD:-StrongPassword123!}"

  billing-service:
    build:
      context: .
      dockerfile: src/OpenRussiaRouter.BillingService/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__BillingDb: "Host=postgres;Port=5432;Database=openrussiarouter;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres};Pooling=true;MinPoolSize=5;MaxPoolSize=50;ConnectionIdleTimeout=300"
      Seq__Url: "http://seq:80"

  control-plane:
    build:
      context: .
      dockerfile: src/OpenRussiaRouter.ControlPlane/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ControlPlaneDb: "Host=postgres;Port=5432;Database=openrussiarouter;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres};Pooling=true;MinPoolSize=5;MaxPoolSize=50;ConnectionIdleTimeout=300"
      GrpcServices__Auth: "http://auth-service:8080"
      Seq__Url: "http://seq:80"
      RouterHealthChecks__NodeTokens: ""

  api-gateway:
    build:
      context: .
      dockerfile: src/OpenRussiaRouter.ApiGateway/Dockerfile
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
      billing-service:
        condition: service_started
      control-plane:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      GrpcServices__Auth: "http://auth-service:8080"
      GrpcServices__Billing: "http://billing-service:8080"
      GrpcServices__ControlPlane: "http://control-plane:8080"
      Seq__Url: "http://seq:80"

  webapp:
    build:
      context: .
      dockerfile: src/OpenRussiaRouter.WebApp/Dockerfile
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
      billing-service:
        condition: service_started
      control-plane:
        condition: service_started
    ports:
      - "3000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      GrpcServices__Auth: "http://auth-service:8080"
      GrpcServices__Billing: "http://billing-service:8080"
      GrpcServices__ControlPlane: "http://control-plane:8080"
      Seq__Url: "http://seq:80"

  prometheus:
    image: prom/prometheus:v2.51.2
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:10.4.2
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false

volumes:
  postgres_data:
  seq_data:
  prometheus_data:
  grafana_data:
