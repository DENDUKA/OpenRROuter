server {
    listen       80;
    server_name  _;

    # VitePress собран с base='/docs/' и положен в /usr/share/nginx/html/docs/.
    # Браузер видит URI вида /docs/, /docs/guide/models, /docs/assets/x.css —
    # все они разрешаются файлом /usr/share/nginx/html/docs/...
    # cleanUrls=true требует try_files с $uri.html, иначе чистые ссылки дают 404.
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri.html $uri/ =404;
    }
}
