apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
  namespace: argocd
data:
  interval: 2m
  log.level: info
  registries.conf: |
    registries:
      - name: "GitHub Container Registry"
        prefix: "ghcr.io"
        api_url: "https://ghcr.io"
        insecure: false
        credentials: "secret:argocd/argocd-image-updater-secret#ghcr.token"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-ssh-config
  namespace: argocd
data: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-image-updater-secret
  namespace: argocd
type: Opaque
stringData: {}
