apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
  namespace: argocd
data:
  interval: 2m
  log.level: info
  git.user: argocd-image-updater
  git.email: argocd-image-updater@users.noreply.github.com
  registries.conf: |
    registries:
      - name: "GitHub Container Registry"
        prefix: "ghcr.io"
        api_url: "https://ghcr.io"
        insecure: false
        credentials: "pullsecret:argocd/ghcr-pull-secret"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-ssh-config
  namespace: argocd
data: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-image-updater-secret
  namespace: argocd
type: Opaque
stringData: {}
