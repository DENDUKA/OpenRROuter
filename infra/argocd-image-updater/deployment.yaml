apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-image-updater-controller
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-image-updater-controller
    control-plane: argocd-image-updater-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: argocd-image-updater-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-image-updater
        control-plane: argocd-image-updater-controller
      annotations:
        kubectl.kubernetes.io/default-container: argocd-image-updater-controller
    spec:
      serviceAccountName: argocd-image-updater-controller
      securityContext:
        runAsNonRoot: true
      containers:
        - name: argocd-image-updater-controller
          image: quay.io/argoprojlabs/argocd-image-updater:v1.2.0
          imagePullPolicy: Always
          args:
            - --metrics-bind-address=:8080
            - run
          env:
            - name: ARGOCD_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: argocd-image-updater-config
                  key: argocd.namespace
                  optional: true
            - name: IMAGE_UPDATER_WATCH_NAMESPACES
              valueFrom:
                configMapKeyRef:
                  name: argocd-image-updater-config
                  key: watch.namespaces
                  optional: true
            - name: IMAGE_UPDATER_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: argocd-image-updater-config
                  key: interval
                  optional: true
            - name: IMAGE_UPDATER_LOGLEVEL
              valueFrom:
                configMapKeyRef:
                  name: argocd-image-updater-config
                  key: log.level
                  optional: true
            - name: GIT_COMMIT_USER
              valueFrom:
                configMapKeyRef:
                  name: argocd-image-updater-config
                  key: git.user
                  optional: true
            - name: GIT_COMMIT_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: argocd-image-updater-config
                  key: git.email
                  optional: true
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: image-updater-conf
              mountPath: /app/config
            - name: ssh-known-hosts
              mountPath: /app/config/ssh
            - name: ssh-config
              mountPath: /app/.ssh
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: image-updater-conf
          configMap:
            name: argocd-image-updater-config
            optional: true
            items:
              - key: registries.conf
                path: registries.conf
              - key: git.commit-message-template
                path: commit.template
        - name: ssh-known-hosts
          configMap:
            name: argocd-ssh-known-hosts-cm
            optional: true
        - name: ssh-config
          configMap:
            name: argocd-image-updater-ssh-config
            optional: true
        - name: tmp
          emptyDir: {}
