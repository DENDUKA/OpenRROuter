apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orr-services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # argocd-image-updater removed

spec:
  project: default
  source:
    repoURL: https://github.com/DENDUKA/OpenRussiaRouter.git
    targetRevision: main
    path: infra/kustomize/overlays/dev/services
  destination:
    server: https://kubernetes.default.svc
    namespace: orr-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orr-infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/DENDUKA/OpenRussiaRouter.git
    targetRevision: main
    path: infra/kustomize/overlays/dev/infra
  destination:
    server: https://kubernetes.default.svc
    namespace: orr-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
