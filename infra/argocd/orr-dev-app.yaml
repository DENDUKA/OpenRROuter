apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orr-services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd-image-updater.argoproj.io/image-list: api-gateway=ghcr.io/denduka/api-gateway:dev-latest,auth-service=ghcr.io/denduka/auth-service:dev-latest,billing-service=ghcr.io/denduka/billing-service:dev-latest,control-plane=ghcr.io/denduka/control-plane:dev-latest,webapp=ghcr.io/denduka/webapp:dev-latest
    argocd-image-updater.argoproj.io/api-gateway.update-strategy: digest
    argocd-image-updater.argoproj.io/api-gateway.pull-secret: pullsecret:argocd/ghcr-pull-secret
    argocd-image-updater.argoproj.io/auth-service.update-strategy: digest
    argocd-image-updater.argoproj.io/auth-service.pull-secret: pullsecret:argocd/ghcr-pull-secret
    argocd-image-updater.argoproj.io/billing-service.update-strategy: digest
    argocd-image-updater.argoproj.io/billing-service.pull-secret: pullsecret:argocd/ghcr-pull-secret
    argocd-image-updater.argoproj.io/control-plane.update-strategy: digest
    argocd-image-updater.argoproj.io/control-plane.pull-secret: pullsecret:argocd/ghcr-pull-secret
    argocd-image-updater.argoproj.io/webapp.update-strategy: digest
    argocd-image-updater.argoproj.io/webapp.pull-secret: pullsecret:argocd/ghcr-pull-secret
    argocd-image-updater.argoproj.io/write-back-method: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DENDUKA/OpenRussiaRouter.git
    targetRevision: main
    path: infra/kustomize/overlays/dev/services
  destination:
    server: https://kubernetes.default.svc
    namespace: orr-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orr-infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/DENDUKA/OpenRussiaRouter.git
    targetRevision: main
    path: infra/kustomize/overlays/dev/infra
  destination:
    server: https://kubernetes.default.svc
    namespace: orr-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
