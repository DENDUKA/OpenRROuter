apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orr-argocd-image-updater
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/DENDUKA/OpenRussiaRouter.git
    targetRevision: main
    path: infra/argocd-image-updater
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
