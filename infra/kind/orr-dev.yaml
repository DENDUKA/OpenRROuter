apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: orr-dev
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
      - containerPort: 30090
        hostPort: 9090
        protocol: TCP
      - containerPort: 30081
        hostPort: 18081
        protocol: TCP
      - containerPort: 30128
        hostPort: 20128
        protocol: TCP
