# HMAC salt for pseudonymizing users (analytics.events) and visitors (analytics.site_visits).
#
# It MUST be identical across webapp, auth-service and billing-service: the site-visit row of a
# signed-in visitor carries the same distinct_id as its analytics events, and that identity is
# what makes the "visit -> signup" funnel computable inside one database. A per-service salt
# would silently split one person into several.
#
# Rotating the salt re-pseudonymizes everyone — historical rows keep the old identity and no
# longer join to the new one. Treat it as append-only in any environment whose numbers matter.
#
# This is a dev placeholder committed on purpose, exactly like postgres-secret.yaml. Production
# runs on compose and takes its salt from the gitignored /opt/orr/.env instead.
apiVersion: v1
kind: Secret
metadata:
  name: analytics-secret
  namespace: orr-dev
type: Opaque
stringData:
  identity-salt: CHANGE_ME_IN_PRODUCTION_dev_analytics_salt
