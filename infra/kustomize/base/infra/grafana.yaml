apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: orr-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.5.2
          ports:
            - name: ui
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            # Interpolated into provisioning/datasources by Grafana itself ($VAR syntax).
            # Never inline the password in the ConfigMap — that file is in git.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
          volumeMounts:
            - name: grafana-provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboards
              mountPath: /etc/grafana/dashboards
            # Nested mount: the provider scans /etc/grafana/dashboards recursively, so the
            # shared compose dashboards land in a subfolder without touching the CM above.
            - name: grafana-dashboards-orr
              mountPath: /etc/grafana/dashboards/orr
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: grafana-provisioning-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-provisioning-dashboards
          configMap:
            name: grafana-dashboard-providers
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
        - name: grafana-dashboards-orr
          configMap:
            name: grafana-dashboards-orr
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: orr-dev
spec:
  ports:
    - name: ui
      port: 3000
      targetPort: 3000
  selector:
    app: grafana
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: orr-dev
data:
  prometheus.yml: |
    apiVersion: 1

    deleteDatasources:
      - name: Prometheus
        orgId: 1

    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
  # Postgres datasources backing the dashboards shared with the compose deployment. The uids
  # (orrbilling / orranalytics) are referenced by the dashboard JSON and MUST match the ones
  # in deploy/compose/grafana/provisioning/datasources/datasources.yml.
  #
  # Prod keeps auth+billing in a single database; this cluster splits them per service, so
  # `auth.*` reaches orr_billing as a postgres_fdw foreign schema (see migration-job.yaml).
  postgres.yml: |
    apiVersion: 1

    datasources:
      - name: ORR Billing
        uid: orrbilling
        type: postgres
        access: proxy
        url: postgres:5432
        database: orr_billing
        user: orr
        editable: false
        secureJsonData:
          password: $POSTGRES_PASSWORD
        jsonData:
          sslmode: disable
          postgresVersion: 1600

      - name: ORR Analytics
        uid: orranalytics
        type: postgres
        access: proxy
        url: postgres:5432
        database: orr_analytics
        user: orr
        editable: false
        secureJsonData:
          password: $POSTGRES_PASSWORD
        jsonData:
          sslmode: disable
          postgresVersion: 1600
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: orr-dev
data:
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: 'OpenRussiaRouter'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/dashboards

