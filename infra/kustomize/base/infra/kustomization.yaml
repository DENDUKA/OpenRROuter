apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orr-dev
resources:
  - namespaces.yaml
  - postgres.yaml
  - postgres-secret.yaml
  - analytics-secret.yaml
  - seq.yaml
  - grafana.yaml
  - grafana-dashboards-cm.yaml
  - prometheus.yaml
  - migration-job.yaml
  - network-policies.yaml

# Dashboards shared with the compose deployment. The files under dashboards/ are copies of
# deploy/compose/grafana/dashboards/ — kustomize refuses to read files outside its own
# directory, so they cannot be symlinked or referenced up the tree. Keep both copies in sync
# when a dashboard changes.
configMapGenerator:
  - name: grafana-dashboards-orr
    files:
      - dashboards/users.json
      - dashboards/limits.json
      - dashboards/analytics.json
      # Needs the Business Text plugin (GF_INSTALL_PLUGINS in grafana.yaml) and the
      # control.* foreign schema in orr_billing (migration-job.yaml).
      - dashboards/nodes-providers.json
