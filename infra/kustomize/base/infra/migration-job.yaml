apiVersion: batch/v1
kind: Job
metadata:
  name: db-create
  namespace: orr-dev
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: db-create
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres..."
              until pg_isready -h postgres -U orr -t 3; do
                sleep 3
              done
              echo "Postgres is ready."
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
      containers:
        - name: create-databases
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              set -e
              for db in orr_auth orr_billing orr_control; do
                if ! psql -h postgres -U orr -d postgres -tAc \
                    "SELECT 1 FROM pg_database WHERE datname='$db'" | grep -q 1; then
                  echo "Creating database: $db"
                  psql -h postgres -U orr -d postgres -c "CREATE DATABASE \"$db\""
                else
                  echo "Database already exists: $db"
                fi
              done
              echo "All databases ready."
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
