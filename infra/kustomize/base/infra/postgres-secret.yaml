  name: postgres-secret
  namespace: orr-dev
type: Opaque
stringData:
  password: CHANGE_ME_IN_PRODUCTION
  auth-connection: Host=postgres;Port=5432;Database=orr_auth;Username=orr;Password=CHANGE_ME_IN_PRODUCTION
  billing-connection: Host=postgres;Port=5432;Database=orr_billing;Username=orr;Password=CHANGE_ME_IN_PRODUCTION
  control-connection: Host=postgres;Port=5432;Database=orr_control;Username=orr;Password=CHANGE_ME_IN_PRODUCTION
  content-connection: Host=postgres;Port=5432;Database=orr_content;Username=orr;Password=CHANGE_ME_IN_PRODUCTION
  gateway-connection: Host=postgres;Port=5432;Database=orr_gateway;Username=orr;Password=CHANGE_ME_IN_PRODUCTION
