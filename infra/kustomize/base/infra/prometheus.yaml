apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: orr-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: orr-dev
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: orr-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: orr-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: orr-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.2
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - name: web
              containerPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
            - name: data-volume
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
        - name: data-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: orr-dev
spec:
  ports:
    - name: web
      port: 9090
      targetPort: 9090
  selector:
    app: prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: orr-dev
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s

    scrape_configs:
      # HTTP-front services expose Prometheus metrics on the service port (80).
      # Force classic exposition format (PrometheusText0.0.4); the OpenTelemetry
      # OpenMetrics output (with # UNIT lines) breaks the strict parser.
      - job_name: 'openrussiarouter_http'
        metrics_path: '/metrics'
        scrape_protocols:
          - PrometheusText0.0.4
        static_configs:
          - targets:
            - 'api-gateway:80'
            - 'webapp:80'

      # gRPC services map their service port 8080 -> gRPC pod port 8081.
      # The HTTP/1 metrics endpoint lives on pod port 8080, which is not exposed
      # through the service, so scrape the pods directly via discovery.
      - job_name: 'openrussiarouter_grpc'
        metrics_path: '/metrics'
        scrape_protocols:
          - PrometheusText0.0.4
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - orr-dev
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: 'auth-service|billing-service|control-plane|collector'
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: '8080'
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance
