apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: orr-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/denduka/api-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: Seq__Url
              value: "http://seq:5341"
            - name: Seq__ServiceName
              value: "api-gateway"
            - name: GrpcServices__Auth
              value: "http://auth-service:8080"
            - name: GrpcServices__Billing
              value: "http://billing-service:8080"
            - name: GrpcServices__ControlPlane
              value: "http://control-plane:8080"
            - name: ServiceAuth__BillingToken
              valueFrom:
                secretKeyRef:
                  name: orr-s2s-secret
                  key: apigateway-token
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: orr-dev
spec:
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: api-gateway
