apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: orr-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/denduka/auth-service:latest
          ports:
            - containerPort: 8080
            - containerPort: 8081
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: Kestrel__Endpoints__Http__Url
              value: "http://+:8080"
            - name: Kestrel__Endpoints__Http__Protocols
              value: "Http1"
            - name: Kestrel__Endpoints__Grpc__Url
              value: "http://+:8081"
            - name: Kestrel__Endpoints__Grpc__Protocols
              value: "Http2"
            - name: Seq__Url
              value: "http://seq:5341"
            - name: Seq__ServiceName
              value: "auth-service"
            - name: ConnectionStrings__AuthDb
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: auth-connection
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: orr-dev
spec:
  ports:
    - port: 8080
      targetPort: 8081
  selector:
    app: auth-service
