apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: orr-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      containers:
        - name: billing-service
          image: ghcr.io/denduka/billing-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: Seq__Url
              value: "http://seq:5341"
            - name: Seq__ServiceName
              value: "billing-service"
            - name: ConnectionStrings__BillingDb
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: billing-connection
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: orr-dev
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: billing-service
