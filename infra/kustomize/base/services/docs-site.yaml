apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-site
  namespace: orr-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docs-site
  template:
    metadata:
      labels:
        app: docs-site
    spec:
      containers:
        - name: docs-site
          image: ghcr.io/denduka/docs-site:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: docs-site
  namespace: orr-dev
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: docs-site
