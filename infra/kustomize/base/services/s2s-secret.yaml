apiVersion: v1
kind: Secret
metadata:
  name: orr-s2s-secret
  namespace: orr-dev
type: Opaque
# Service-to-service (TS-003) shared tokens guarding mutating BillingService gRPC methods.
# Caller ids are hyphen-free (apigateway / webappadmin) so they are valid k8s env var names
# on every cluster version. Same value is wired into the calling service's
# ServiceAuth__BillingToken and into BillingService's ServiceAuth__Tokens__<caller>.
# Dev defaults below — rotate / override per environment.
stringData:
