apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docs-site-ingress
  namespace: orr-dev
spec:
  ingressClassName: nginx
  rules:
    - host: docs.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docs-site
                port:
                  number: 80
