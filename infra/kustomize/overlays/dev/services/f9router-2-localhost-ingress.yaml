apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: f9router-2-localhost-ingress
  namespace: orr-dev
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: f9router-2.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: f9router-2
                port:
                  number: 80
