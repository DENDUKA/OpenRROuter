apiVersion: apps/v1
kind: Deployment
metadata:
  name: f9router
  namespace: orr-dev
spec:
  template:
    spec:
      containers:
        - name: f9router
          env:
            - name: BASE_URL
              value: "http://f9router.local"
            - name: NEXT_PUBLIC_BASE_URL
              value: "http://f9router.local"
