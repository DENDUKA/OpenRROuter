apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orr-dev
resources:
- ../../../base/services
- webapp-localhost-ingress.yaml
- api-gateway-localhost-ingress.yaml
- f9router-localhost-ingress.yaml
- f9router-2-localhost-ingress.yaml
- mock-llm-node.yaml

patches:
- path: webapp-google-patch.yaml
- path: f9router-env-patch.yaml
- path: f9router-2-env-patch.yaml
- path: f9router-nodeport.yaml
- path: f9router-2-nodeport.yaml
- path: control-plane-env-patch.yaml
- path: webapp-env-patch.yaml
commonAnnotations:
  argocd.argoproj.io/sync-wave: "1"
  orr.dev/version: dev
images:
- name: ghcr.io/denduka/api-gateway
  newTag: dev-latest
- name: ghcr.io/denduka/auth-service
  newTag: dev-latest
- name: ghcr.io/denduka/billing-service
  newTag: dev-latest
- name: ghcr.io/denduka/control-plane
  newTag: dev-latest
- name: ghcr.io/denduka/webapp
  newTag: dev-latest
- name: ghcr.io/inc64/f9router
  newTag: dev-latest
