global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'openrussiarouter'
    metrics_path: '/metrics'
    static_configs:
      - targets: 
        - 'api-gateway:8080'
        - 'auth-service:8080'
        - 'billing-service:8080'
        - 'control-plane:8080'
        - 'collector:8080'
        - 'webapp:8080'
