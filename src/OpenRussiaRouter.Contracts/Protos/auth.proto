syntax = "proto3";

package openrussiarouter.auth.v1;

option csharp_namespace = "OpenRussiaRouter.Contracts.Grpc.Auth.V1";

service AuthService {
  rpc ValidateApiKey (ValidateApiKeyRequest) returns (ValidateApiKeyResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc RegisterUser (RegisterUserRequest) returns (RegisterUserResponse);
  rpc VerifyEmail (VerifyEmailRequest) returns (LoginResponse);
  rpc ResendVerification (ResendVerificationRequest) returns (ResendVerificationResponse);
  rpc CreateInvite (CreateInviteRequest) returns (CreateInviteResponse);
  rpc CompleteInvite (CompleteInviteRequest) returns (CompleteInviteResponse);
  rpc CreateApiKey (CreateApiKeyRequest) returns (CreateApiKeyResponse);
  rpc DisableApiKey (DisableApiKeyRequest) returns (DisableApiKeyResponse);
  rpc EnableApiKey (EnableApiKeyRequest) returns (EnableApiKeyResponse);
  rpc DeleteApiKey (DeleteApiKeyRequest) returns (DeleteApiKeyResponse);
  rpc ListApiKeys (ListApiKeysRequest) returns (ListApiKeysResponse);
  rpc RenameApiKey (RenameApiKeyRequest) returns (RenameApiKeyResponse);
  rpc ListUsers (ListUsersRequest) returns (ListUsersResponse);
  rpc ListActiveApiKeyHashes (ListActiveApiKeyHashesRequest) returns (ListActiveApiKeyHashesResponse);
  rpc GetFirstActiveApiKeyRaw (GetFirstActiveApiKeyRawRequest) returns (GetFirstActiveApiKeyRawResponse);
  rpc LoginOrRegisterWithGoogle (LoginWithGoogleRequest) returns (LoginResponse);
  rpc ListAllActiveApiKeysRaw (ListAllActiveApiKeysRawRequest) returns (ListAllActiveApiKeysRawResponse);
  rpc ListAllNonDeletedApiKeysRaw (ListAllNonDeletedApiKeysRawRequest) returns (ListAllNonDeletedApiKeysRawResponse);
  rpc GetUser (GetUserRequest) returns (GetUserResponse);
  rpc UpdateUser (UpdateUserRequest) returns (UpdateUserResponse);
}

message ValidateApiKeyRequest {
  string raw_key = 1;
}

message ValidateApiKeyResponse {
  bool is_valid = 1;
  string user_id = 2;
  string api_key_id = 3;
  string error_code = 4;
  string api_key_prefix = 5;
  string role = 6;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  bool succeeded = 1;
  string session_token = 2;
  string user_id = 3;
  string role = 4;
  string error_code = 5;
}

message RegisterUserRequest {
  string email = 1;
  string password = 2;
}

message RegisterUserResponse {
  bool succeeded = 1;
  string user_id = 2;
  string email = 3;
  string verification_code = 4;
  string error_code = 5;
}

message VerifyEmailRequest {
  string email = 1;
  string code = 2;
}

message ResendVerificationRequest {
  string email = 1;
}

message ResendVerificationResponse {
  bool succeeded = 1;
  string email = 2;
  string verification_code = 3;
  string error_code = 4;
}

message CreateInviteRequest {
  string email = 1;
  string role = 2;
  string created_by_admin_id = 3;
  int64 expires_at_unix_time_seconds = 4;
}

message CreateInviteResponse {
  bool is_created = 1;
  string invite_id = 2;
  string raw_token = 3;
  string email = 4;
  string role = 5;
  int64 expires_at_unix_time_seconds = 6;
  string error_code = 7;
}

message CompleteInviteRequest {
  string raw_token = 1;
  string password = 2;
}

message CompleteInviteResponse {
  bool is_completed = 1;
  string user_id = 2;
  string email = 3;
  string role = 4;
  string error_code = 5;
}

message CreateApiKeyRequest {
  string user_id = 1;
  string name = 2;
}

message CreateApiKeyResponse {
  bool is_created = 1;
  string api_key_id = 2;
  string raw_key = 3;
  string prefix = 4;
  string name = 5;
  int64 created_at_unix_time_seconds = 6;
  string error_code = 7;
}

message DisableApiKeyRequest {
  string user_id = 1;
  string api_key_id = 2;
}

message DisableApiKeyResponse {
  bool is_disabled = 1;
  string error_code = 2;
}

message EnableApiKeyRequest {
  string user_id = 1;
  string api_key_id = 2;
}

message EnableApiKeyResponse {
  bool is_enabled = 1;
  string error_code = 2;
}

message DeleteApiKeyRequest {
  string user_id = 1;
  string api_key_id = 2;
}

message DeleteApiKeyResponse {
  bool is_deleted = 1;
  string error_code = 2;
}

message ListApiKeysRequest {
  string user_id = 1;
  bool include_deleted = 2;
}

message ListApiKeysResponse {
  repeated ApiKeyInfo keys = 1;
}

message ApiKeyInfo {
  string id = 1;
  string name = 2;
  string prefix = 3;
  int64 created_at_unix_time_seconds = 4;
  int64 last_used_at_unix_time_seconds = 5;
  int64 disabled_at_unix_time_seconds = 6;
  bool is_active = 7;
  bool is_deleted = 8;
}

message RenameApiKeyRequest {
  string user_id = 1;
  string api_key_id = 2;
  string name = 3;
}

message RenameApiKeyResponse {
  bool is_renamed = 1;
  string error_code = 2;
}

message ListUsersRequest {
}

message ListUsersResponse {
  repeated UserInfo users = 1;
}

message UserInfo {
  string id = 1;
  string email = 2;
  string role = 3;
  string status = 4;
  int64 created_at_unix_time_seconds = 5;
  optional string display_name = 6;
  int32 max_api_keys = 7;
}

message ListActiveApiKeyHashesRequest {}

message ApiKeyHashEntry {
  string prefix      = 1;
  string secret_hash = 2;
}

message ListActiveApiKeyHashesResponse {
  repeated ApiKeyHashEntry keys = 1;
}

message GetFirstActiveApiKeyRawRequest {
  string user_id = 1;
}

message GetFirstActiveApiKeyRawResponse {
  string raw_key = 1;
}

message LoginWithGoogleRequest {
  string google_sub = 1;
  string email      = 2;
}

message ListAllActiveApiKeysRawRequest {}

message ActiveApiKeyRaw {
  string api_key_id = 1;
  string raw_key = 2;
  string user_id = 3;
  string name = 4;
}

message ListAllActiveApiKeysRawResponse {
  repeated ActiveApiKeyRaw keys = 1;
}

message ListAllNonDeletedApiKeysRawRequest {}

message NonDeletedApiKeyRaw {
  string api_key_id = 1;
  string raw_key = 2;
  string user_id = 3;
  string name = 4;
  bool is_active = 5;
}

message ListAllNonDeletedApiKeysRawResponse {
  repeated NonDeletedApiKeyRaw keys = 1;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  UserInfo user = 1;
}

message UpdateUserRequest {
  string user_id = 1;
  optional string display_name = 2;
  int32 max_api_keys = 3;
}

message UpdateUserResponse {
  bool succeeded = 1;
  string error_code = 2;
}
