syntax = "proto3";

package openrussiarouter.billing.v1;

option csharp_namespace = "OpenRussiaRouter.Contracts.Grpc.Billing.V1";

service BillingService {
  rpc CheckBalanceAndModel (CheckBalanceAndModelRequest) returns (CheckBalanceAndModelResponse);
  rpc RecordUsage (RecordUsageRequest) returns (RecordUsageResponse);
  rpc ListPublicModels (ListPublicModelsRequest) returns (ListPublicModelsResponse);
  rpc GetBalance (GetBalanceRequest) returns (GetBalanceResponse);
  rpc CreateVirtualTopUp (CreateVirtualTopUpRequest) returns (CreateVirtualTopUpResponse);
  rpc UpsertModelPrice (UpsertModelPriceRequest) returns (UpsertModelPriceResponse);
  rpc ListUsage (ListUsageRequest) returns (ListUsageResponse);
  rpc ListBillingAnomalies (ListBillingAnomaliesRequest) returns (ListBillingAnomaliesResponse);
  rpc ListModels (ListModelsRequest) returns (ListModelsResponse);
  rpc ListActivityByToken (ListActivityByTokenRequest) returns (ListActivityByTokenResponse);
  rpc GetActivitySummary (GetActivitySummaryRequest) returns (GetActivitySummaryResponse);
  rpc ListTopUps (ListTopUpsRequest) returns (ListTopUpsResponse);
  rpc ListAdminRequests (ListAdminRequestsRequest) returns (ListAdminRequestsResponse);
}

message CheckBalanceAndModelRequest {
  string user_id = 1;
  string model_id = 2;
  bool admin_bypass_disabled = 3;
}

message CheckBalanceAndModelResponse {
  bool allowed = 1;
  string model_id = 2;
  string price_version = 3;
  string balance_usd = 4;
  string error_code = 5;
  string router_model_id = 6;
}

message TokenUsage {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  int64 cache_tokens = 3;
}

message RecordUsageRequest {
  string request_id = 1;
  string user_id = 2;
  string api_key_id = 3;
  string model_id = 4;
  string router_node_id = 5;
  TokenUsage usage = 6;
  string status = 7;
  string started_at_utc = 8;
  string completed_at_utc = 9;
  string api_key_prefix = 10;
  string provider_name = 11;
  string provider_account = 12;
}

message RecordUsageResponse {
  bool accepted = 1;
  string request_id = 2;
  string error_code = 3;
}

message ListPublicModelsRequest {
}

message PublicModel {
  string id = 1;
  string display_name = 2;
  string upstream_model_id = 3;
  string input_price_per_1m_usd = 4;
  string output_price_per_1m_usd = 5;
  int32  context_length = 6;
  string modalities = 7;
  string description = 8;
}

message ListPublicModelsResponse {
  repeated PublicModel models = 1;
}

message GetBalanceRequest {
  string user_id = 1;
}

message GetBalanceResponse {
  string user_id = 1;
  string balance_usd = 2;
  string error_code = 3;
}

message CreateVirtualTopUpRequest {
  string admin_id = 1;
  string user_id = 2;
  string amount_usd = 3;
  string reason = 4;
  string idempotency_key = 5;
}

message CreateVirtualTopUpResponse {
  bool created = 1;
  string ledger_entry_id = 2;
  string user_id = 3;
  string amount_usd = 4;
  string balance_usd = 5;
  string error_code = 6;
}

message UpsertModelPriceRequest {
  string model_id = 1;
  string display_name = 2;
  string upstream_model_id = 3;
  string price_version = 4;
  string input_price_per_1m_usd = 5;
  string output_price_per_1m_usd = 6;
  string cache_price_per_1m_usd = 7;
  bool   enabled = 8;
  string description = 9;
  int32  context_length = 10;
  string modalities = 11;
  string description_source = 12;
}

message UpsertModelPriceResponse {
  bool upserted = 1;
  string model_id = 2;
  string error_code = 3;
}

message ListBillingAnomaliesRequest {
}

message ListModelsRequest {
}

message ModelDetail {
  string id = 1;
  string display_name = 2;
  string upstream_model_id = 3;
  string price_version = 4;
  string input_price_per_1m_usd = 5;
  string output_price_per_1m_usd = 6;
  string cache_price_per_1m_usd = 7;
  bool   enabled = 8;
  string description = 9;
  int32  context_length = 10;
  string modalities = 11;
  string description_source = 12;
}

message ListModelsResponse {
  repeated ModelDetail models = 1;
}

message BillingAnomaly {
  string id = 1;
  string request_id = 2;
  string type = 3;
  string message = 4;
  string created_at_utc = 5;
}

message ListUsageRequest {
  string user_id = 1;
}

message UsageRecord {
  string request_id = 1;
  string user_id = 2;
  string api_key_id = 3;
  string model_id = 4;
  string price_version = 5;
  string router_node_id = 6;
  TokenUsage usage = 7;
  string cost_usd = 8;
  string status = 9;
  string created_at_utc = 10;
}

message ListUsageResponse {
  repeated UsageRecord records = 1;
}

message ListActivityByTokenRequest {
  repeated string api_key_ids = 1;
  string from_utc = 2;
  string to_utc = 3;
  string model_id_filter = 4;
  string api_key_id_filter = 5;
  string after_created_at_utc = 6;
  int32 page_size = 7;
}

message ActivityByTokenRecord {
  string request_id = 1;
  string api_key_id = 2;
  string api_key_prefix = 3;
  string model_id = 4;
  string router_node_id = 5;
  TokenUsage usage = 6;
  string status = 7;
  string created_at_utc = 8;
  string completed_at_utc = 9;
  string cost_usd = 10;
  string provider_name = 11;
  string provider_account = 12;
}

message ListActivityByTokenResponse {
  repeated ActivityByTokenRecord records = 1;
  bool has_more = 2;
  string next_cursor = 3;
}

message GetActivitySummaryRequest {
  repeated string api_key_ids = 1;
  string from_utc = 2;
  string to_utc = 3;
}

message ActivityModelSummary {
  string model_id = 1;
  int64 requests = 2;
  int64 input_tokens = 3;
  int64 output_tokens = 4;
  int64 cache_tokens = 5;
  string cost_usd = 6;
}

message ActivityKeySummary {
  string api_key_id = 1;
  string api_key_prefix = 2;
  int64 requests = 3;
  int64 input_tokens = 4;
  int64 output_tokens = 5;
  int64 cache_tokens = 6;
  string cost_usd = 7;
}

message GetActivitySummaryResponse {
  int64 total_requests = 1;
  int64 total_input_tokens = 2;
  int64 total_output_tokens = 3;
  int64 total_cache_tokens = 4;
  string total_cost_usd = 5;
  repeated ActivityModelSummary models = 6;
  repeated ActivityKeySummary keys = 7;
}

message ListBillingAnomaliesResponse {
  repeated BillingAnomaly anomalies = 1;
}

message ListTopUpsRequest {
  string user_id = 1;
}

message TopUpRecord {
  string id = 1;
  string amount_usd = 2;
  string reason = 3;
  string created_at_utc = 4;
}

message ListTopUpsResponse {
  repeated TopUpRecord records = 1;
}

message ListAdminRequestsRequest {
  string after_cursor = 1;
  int32 page_size = 2;
  string model_filter = 3;
  string provider_filter = 4;
  string from_utc = 5;
  string to_utc = 6;
}

message AdminRequestRecord {
  string request_id = 1;
  string user_id = 2;
  string api_key_prefix = 3;
  string model_id = 4;
  string router_node_id = 5;
  string provider_name = 6;
  string provider_account = 7;
  int64 input_tokens = 8;
  int64 output_tokens = 9;
  int64 cache_tokens = 10;
  string status = 11;
  string created_at_utc = 12;
  string completed_at_utc = 13;
  string cost_usd = 14;
}

message ListAdminRequestsResponse {
  repeated AdminRequestRecord records = 1;
  string next_cursor = 2;
}
