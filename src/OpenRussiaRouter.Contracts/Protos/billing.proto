syntax = "proto3";

package openrussiarouter.billing.v1;

option csharp_namespace = "OpenRussiaRouter.Contracts.Grpc.Billing.V1";

service BillingService {
  rpc CheckBalanceAndModel (CheckBalanceAndModelRequest) returns (CheckBalanceAndModelResponse);
  rpc RecordUsage (RecordUsageRequest) returns (RecordUsageResponse);
  rpc ListPublicModels (ListPublicModelsRequest) returns (ListPublicModelsResponse);
  rpc GetBalance (GetBalanceRequest) returns (GetBalanceResponse);
  rpc CreateVirtualTopUp (CreateVirtualTopUpRequest) returns (CreateVirtualTopUpResponse);
  rpc UpsertModelPrice (UpsertModelPriceRequest) returns (UpsertModelPriceResponse);
  rpc ListUsage (ListUsageRequest) returns (ListUsageResponse);
  rpc ListBillingAnomalies (ListBillingAnomaliesRequest) returns (ListBillingAnomaliesResponse);
  rpc ListModels (ListModelsRequest) returns (ListModelsResponse);
  rpc ListActivityByToken (ListActivityByTokenRequest) returns (ListActivityByTokenResponse);
  rpc GetActivitySummary (GetActivitySummaryRequest) returns (GetActivitySummaryResponse);
  rpc ListTopUps (ListTopUpsRequest) returns (ListTopUpsResponse);
  rpc ListAdminRequests (ListAdminRequestsRequest) returns (ListAdminRequestsResponse);
  rpc ListTags (ListTagsRequest) returns (ListTagsResponse);
  rpc UpsertTag (UpsertTagRequest) returns (UpsertTagResponse);
  rpc DeleteTag (DeleteTagRequest) returns (DeleteTagResponse);
  rpc GetFxQuote (GetFxQuoteRequest) returns (GetFxQuoteResponse);
  rpc CreatePayment (CreatePaymentRequest) returns (CreatePaymentResponse);
  rpc AttachProviderRef (AttachProviderRefRequest) returns (AttachProviderRefResponse);
  rpc ConfirmPaymentByProvider (ConfirmPaymentByProviderRequest) returns (ConfirmPaymentByProviderResponse);
  rpc ApplyPaymentEvent (ApplyPaymentEventRequest) returns (ApplyPaymentEventResponse);
  rpc GetPayment (GetPaymentRequest) returns (PaymentRecord);
  rpc ListPayments (ListPaymentsRequest) returns (ListPaymentsResponse);
  rpc AcquireStalePayments (AcquireStalePaymentsRequest) returns (AcquireStalePaymentsResponse);
  rpc GetPlatformSetting (GetPlatformSettingRequest) returns (GetPlatformSettingResponse);
  rpc SetPlatformSetting (SetPlatformSettingRequest) returns (SetPlatformSettingResponse);
}

message GetPlatformSettingRequest {
  string key = 1;
}

message GetPlatformSettingResponse {
  string value = 1;
  bool found = 2;
}

message SetPlatformSettingRequest {
  string key = 1;
  string value = 2;
}

message SetPlatformSettingResponse {
  bool ok = 1;
  string error_code = 2;
}

message CheckBalanceAndModelRequest {
  string user_id = 1;
  string model_id = 2;
  bool admin_bypass_disabled = 3;
}

message CheckBalanceAndModelResponse {
  bool allowed = 1;
  string model_id = 2;
  string price_version = 3;
  string balance_usd = 4;
  string error_code = 5;
  string router_model_id = 6;
  bool supports_reasoning = 7;
  repeated string allowed_reasoning_efforts = 8;
}

message TokenUsage {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  int64 cache_tokens = 3;
}

message RecordUsageRequest {
  string request_id = 1;
  string user_id = 2;
  string api_key_id = 3;
  string model_id = 4;
  string router_node_id = 5;
  TokenUsage usage = 6;
  string status = 7;
  string started_at_utc = 8;
  string completed_at_utc = 9;
  string api_key_prefix = 10;
  string provider_name = 11;
  string provider_account = 12;
}

message RecordUsageResponse {
  bool accepted = 1;
  string request_id = 2;
  string error_code = 3;
}

message ListPublicModelsRequest {
}

message PublicModel {
  string id = 1;
  string display_name = 2;
  string upstream_model_id = 3;
  string input_price_per_1m_usd = 4;
  string output_price_per_1m_usd = 5;
  int32  context_length = 6;
  string modalities = 7;
  string description = 8;
  repeated string tag_ids = 9;
  string provider = 10;
  string cache_price_per_1m_usd = 11;
  bool supports_reasoning = 12;
  repeated string allowed_reasoning_efforts = 13;
}

message ListPublicModelsResponse {
  repeated PublicModel models = 1;
}

message GetBalanceRequest {
  string user_id = 1;
}

message GetBalanceResponse {
  string user_id = 1;
  string balance_usd = 2;
  string error_code = 3;
}

message CreateVirtualTopUpRequest {
  string admin_id = 1;
  string user_id = 2;
  string amount_usd = 3;
  string reason = 4;
  string idempotency_key = 5;
}

message CreateVirtualTopUpResponse {
  bool created = 1;
  string ledger_entry_id = 2;
  string user_id = 3;
  string amount_usd = 4;
  string balance_usd = 5;
  string error_code = 6;
}

message UpsertModelPriceRequest {
  string model_id = 1;
  string display_name = 2;
  string upstream_model_id = 3;
  string price_version = 4;
  string input_price_per_1m_usd = 5;
  string output_price_per_1m_usd = 6;
  string cache_price_per_1m_usd = 7;
  bool enabled = 8;
  string description = 9;
  int32 context_length = 10;
  string modalities = 11;
  string description_source = 12;
  repeated string tag_ids = 13;
  string provider = 14;
  bool supports_reasoning = 15;
  repeated string allowed_reasoning_efforts = 16;
  string default_reasoning_effort = 17;
}

message UpsertModelPriceResponse {
  bool upserted = 1;
  string model_id = 2;
  string error_code = 3;
}

message ListBillingAnomaliesRequest {
  string after_cursor = 1;
}

message ListModelsRequest {
}

message ModelDetail {
  string id = 1;
  string display_name = 2;
  string upstream_model_id = 3;
  string price_version = 4;
  string input_price_per_1m_usd = 5;
  string output_price_per_1m_usd = 6;
  string cache_price_per_1m_usd = 7;
  bool   enabled = 8;
  string description = 9;
  int32  context_length = 10;
  string modalities = 11;
  string description_source = 12;
  repeated string tag_ids = 13;
  string provider = 14;
  bool supports_reasoning = 15;
  repeated string allowed_reasoning_efforts = 16;
  string default_reasoning_effort = 17;
}

message ListModelsResponse {
  repeated ModelDetail models = 1;
}

message BillingAnomaly {
  string id = 1;
  string request_id = 2;
  string type = 3;
  string message = 4;
  string created_at_utc = 5;
}

message ListUsageRequest {
  string user_id = 1;
  string after_cursor = 2;
}

message UsageRecord {
  string request_id = 1;
  string user_id = 2;
  string api_key_id = 3;
  string model_id = 4;
  string price_version = 5;
  string router_node_id = 6;
  TokenUsage usage = 7;
  string cost_usd = 8;
  string status = 9;
  string created_at_utc = 10;
}

message ListUsageResponse {
  repeated UsageRecord records = 1;
  bool has_more = 2;
  string next_cursor = 3;
}

message ListActivityByTokenRequest {
  repeated string api_key_ids = 1;
  string from_utc = 2;
  string to_utc = 3;
  string model_id_filter = 4;
  string api_key_id_filter = 5;
  string after_cursor = 6;
  int32 page_size = 7;
}

message ActivityByTokenRecord {
  string request_id = 1;
  string api_key_id = 2;
  string api_key_prefix = 3;
  string model_id = 4;
  string router_node_id = 5;
  TokenUsage usage = 6;
  string status = 7;
  string created_at_utc = 8;
  string completed_at_utc = 9;
  string cost_usd = 10;
  string provider_name = 11;
  string provider_account = 12;
}

message ListActivityByTokenResponse {
  repeated ActivityByTokenRecord records = 1;
  bool has_more = 2;
  string next_cursor = 3;
}

message GetActivitySummaryRequest {
  repeated string api_key_ids = 1;
  string from_utc = 2;
  string to_utc = 3;
}

message ActivityModelSummary {
  string model_id = 1;
  int64 requests = 2;
  int64 input_tokens = 3;
  int64 output_tokens = 4;
  int64 cache_tokens = 5;
  string cost_usd = 6;
}

message ActivityKeySummary {
  string api_key_id = 1;
  string api_key_prefix = 2;
  int64 requests = 3;
  int64 input_tokens = 4;
  int64 output_tokens = 5;
  int64 cache_tokens = 6;
  string cost_usd = 7;
}

message GetActivitySummaryResponse {
  int64 total_requests = 1;
  int64 total_input_tokens = 2;
  int64 total_output_tokens = 3;
  int64 total_cache_tokens = 4;
  string total_cost_usd = 5;
  repeated ActivityModelSummary models = 6;
  repeated ActivityKeySummary keys = 7;
}

message ListBillingAnomaliesResponse {
  repeated BillingAnomaly anomalies = 1;
  bool has_more = 2;
  string next_cursor = 3;
}

message ListTopUpsRequest {
  string user_id = 1;
}

message TopUpRecord {
  string id = 1;
  string amount_usd = 2;
  string reason = 3;
  string created_at_utc = 4;
}

message ListTopUpsResponse {
  repeated TopUpRecord records = 1;
}

message ListAdminRequestsRequest {
  string after_cursor = 1;
  int32 page_size = 2;
  string model_filter = 3;
  string provider_filter = 4;
  string from_utc = 5;
  string to_utc = 6;
}

message AdminRequestRecord {
  string request_id = 1;
  string user_id = 2;
  string api_key_prefix = 3;
  string model_id = 4;
  string router_node_id = 5;
  string provider_name = 6;
  string provider_account = 7;
  int64 input_tokens = 8;
  int64 output_tokens = 9;
  int64 cache_tokens = 10;
  string status = 11;
  string created_at_utc = 12;
  string completed_at_utc = 13;
  string cost_usd = 14;
}

message ListAdminRequestsResponse {
  repeated AdminRequestRecord records = 1;
  string next_cursor = 2;
}

message Tag {
  string id = 1;
  string display_name = 2;
  string color = 3;
}

message ListTagsRequest {
}

message ListTagsResponse {
  repeated Tag tags = 1;
}

message UpsertTagRequest {
  string id = 1;
  string display_name = 2;
  string color = 3;
}

message UpsertTagResponse {
  bool upserted = 1;
  string id = 2;
  string error_code = 3;
}

message DeleteTagRequest {
  string id = 1;
}

message DeleteTagResponse {
  bool deleted = 1;
  string error_code = 2;
}

message GetFxQuoteRequest {
  string provider_currency = 1;
}

message GetFxQuoteResponse {
  string rate = 1;
  string usd_per_unit = 2;
  string fx_source = 3;
  string fx_at = 4;
  string quote_id = 5;
  string expires_at = 6;
  string error_code = 7;
}

message CreatePaymentRequest {
  string user_id = 1;
  string provider = 2;
  string provider_amount = 3;
  string provider_currency = 4;
  string display_amount = 5;
  string display_currency = 6;
  string client_token = 7;
}

message CreatePaymentResponse {
  string payment_id = 1;
  string order_id = 2;
  string credited_usd_amount = 3;
  string fx_rate = 4;
  string error_code = 5;
}

message AttachProviderRefRequest {
  string payment_id = 1;
  string provider_payment_id = 2;
  string pay_url = 3;
  string expires_at_utc = 4;
}

message AttachProviderRefResponse {
  bool ok = 1;
  string error_code = 2;
}

message PaymentRecord {
  string id = 1;
  string user_id = 2;
  string provider = 3;
  string provider_payment_id = 4;
  string order_id = 5;
  string display_amount = 6;
  string display_currency = 7;
  string provider_amount = 8;
  string provider_currency = 9;
  string credited_usd_amount = 10;
  string fx_rate = 11;
  string fx_source = 12;
  string fx_at_utc = 13;
  string status = 14;
  string cancel_reason = 15;
  string created_at_utc = 16;
  string expires_at_utc = 17;
  string confirmed_at_utc = 18;
  string canceled_at_utc = 19;
}

message ConfirmPaymentByProviderRequest {
  string provider = 1;
  string provider_payment_id = 2;
  string order_id = 3;
  string confirmed_amount = 4;
  string confirmed_currency = 5;
  string provider_event_id = 6;
  string raw_payload = 7;
  bool signature_ok = 8;
}

message ConfirmPaymentByProviderResponse {
  bool confirmed = 1;
  string ledger_entry_id = 2;
  string balance_usd = 3;
  string error_code = 4;
}

message ApplyPaymentEventRequest {
  string provider = 1;
  string provider_payment_id = 2;
  string order_id = 3;
  string event_type = 4;
  string reason = 5;
  string confirmed_amount = 6;
  string confirmed_currency = 7;
  string provider_event_id = 8;
  string raw_payload = 9;
  bool signature_ok = 10;
}

message ApplyPaymentEventResponse {
  bool applied = 1;
  string ledger_entry_id = 2;
  string error_code = 3;
}

message GetPaymentRequest {
  string payment_id = 1;
}

message ListPaymentsRequest {
  string user_id = 1;
  int32 page_size = 2;
}

message ListPaymentsResponse {
  repeated PaymentRecord records = 1;
}

message AcquireStalePaymentsRequest {
  string worker_id = 1;
  int32 lease_seconds = 2;
  string older_than_utc = 3;
  int32 limit = 4;
}

message AcquireStalePaymentsResponse {
  repeated PaymentRecord records = 1;
}
