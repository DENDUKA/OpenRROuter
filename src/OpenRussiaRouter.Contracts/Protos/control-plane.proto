syntax = "proto3";

package openrussiarouter.controlplane.v1;

option csharp_namespace = "OpenRussiaRouter.Contracts.Grpc.ControlPlane.V1";

service RouterControlPlane {
  rpc SelectRouterNode (SelectRouterNodeRequest) returns (SelectRouterNodeResponse);
  rpc ReleaseRouterNode (ReleaseRouterNodeRequest) returns (ReleaseRouterNodeResponse);
  rpc RegisterRouterNode (RegisterRouterNodeRequest) returns (RegisterRouterNodeResponse);
  rpc DisableRouterNode (DisableRouterNodeRequest) returns (DisableRouterNodeResponse);
  rpc EnableRouterNode (EnableRouterNodeRequest) returns (EnableRouterNodeResponse);
  rpc DeleteRouterNode (DeleteRouterNodeRequest) returns (DeleteRouterNodeResponse);
  rpc ListRouterNodes (ListRouterNodesRequest) returns (ListRouterNodesResponse);
  rpc GetRouterNodeDetails (GetRouterNodeDetailsRequest) returns (GetRouterNodeDetailsResponse);
  rpc PushUserIntegrationKey (PushUserIntegrationKeyRequest) returns (PushUserIntegrationKeyResponse);
  rpc RevokeUserIntegrationKey (RevokeUserIntegrationKeyRequest) returns (RevokeUserIntegrationKeyResponse);
  rpc ListAvailableNodeModels (ListAvailableNodeModelsRequest) returns (ListAvailableNodeModelsResponse);
  rpc ListNodeModelCatalog (ListNodeModelCatalogRequest) returns (ListNodeModelCatalogResponse);
}

message SelectRouterNodeRequest {
  string model_id = 1;
  string request_id = 2;
}

message SelectRouterNodeResponse {
  string lease_id = 1;
  string node_id = 2;
  string endpoint_url = 3;
  string control_token = 4;
  string error_code = 5;
}

message ReleaseRouterNodeRequest {
  string lease_id = 1;
  string status = 2;
}

message ReleaseRouterNodeResponse {
  bool accepted = 1;
}

message RegisterRouterNodeRequest {
  string name = 1;
  string endpoint_url = 2;
  string control_token = 3;
  int32 capacity_weight = 4;
}

message RegisterRouterNodeResponse {
  bool registered = 1;
  string node_id = 2;
  string error_code = 3;
}

message DisableRouterNodeRequest {
  string node_id = 1;
}

message DisableRouterNodeResponse {
  bool disabled = 1;
  string error_code = 2;
}

message EnableRouterNodeRequest {
  string node_id = 1;
}

message EnableRouterNodeResponse {
  bool enabled = 1;
  string error_code = 2;
}

message DeleteRouterNodeRequest {
  string node_id = 1;
}

message DeleteRouterNodeResponse {
  bool deleted = 1;
  string error_code = 2;
}

message ListRouterNodesRequest {
}

message GetRouterNodeDetailsRequest {
  string node_id = 1;
  bool include_inactive_providers = 2;
}

message RouterNodeSummary {
  string node_id = 1;
  string name = 2;
  string endpoint_url = 3;
  string status = 4;
  int32 in_flight_requests = 5;
  string last_checked_at_utc = 6;
  string control_token = 7;
  int32 capacity_weight = 8;
  string last_health_error_code = 9;
}

message ListRouterNodesResponse {
  repeated RouterNodeSummary nodes = 1;
}

message RouterProviderQuotaSummary {
  string connection_id = 1;
  string provider = 2;
  string name = 3;
  string auth_type = 4;
  bool is_active = 5;
  string test_status = 6;
  bool quota_supported = 7;
  string usage_json = 8;
  string error = 9;
}

message RouterIntegrationKeySummary {
  string id = 1;
  string name = 2;
  string key_preview = 3;
  string machine_id = 4;
  bool is_active = 5;
  string managed_by = 6;
  string created_at = 7;
}

message GetRouterNodeDetailsResponse {
  RouterNodeSummary node = 1;
  repeated RouterProviderQuotaSummary providers = 2;
  repeated RouterIntegrationKeySummary keys = 3;
  string error_code = 4;
  string api_error = 5;
}

message PushUserIntegrationKeyRequest {
  string name = 1;
  string raw_key = 2;
  string machine_id = 3;
  string node_id = 4; // если задан — пуш только на эту ноду; если пусто — на все
  string api_key_id = 5; // наш внутренний ID ключа для отслеживания маппинга
}

message PushUserIntegrationKeyResponse {
  int32 pushed_count = 1;
}

message RevokeUserIntegrationKeyRequest {
  string api_key_id = 1; // наш внутренний ID ключа
}

message RevokeUserIntegrationKeyResponse {
  int32 revoked_count = 1;
}

message ListAvailableNodeModelsRequest {}

message ListAvailableNodeModelsResponse {
  repeated string model_ids = 1;
}

message ListNodeModelCatalogRequest {}

message UpstreamModelEntry {
  string upstream_id = 1;
  string public_id = 2;
  string display_name = 3;
  string model_type = 4;
  repeated string source_providers = 5;
  repeated string node_ids = 6;
}

message ListNodeModelCatalogResponse {
  repeated UpstreamModelEntry entries = 1;
  repeated string unreachable_node_ids = 2;
}
