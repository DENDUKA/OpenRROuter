# Keep the existing Compose project/container identity during migration.
# Run with: docker compose -p rawrter-tg-bot -f app/tg_bot/compose.yml ...
services:
  rawrter-tg-bot:
    build: .
    image: rawrter-tg-bot:local
    container_name: rawrter-tg-bot
    restart: unless-stopped
    env_file: ${TG_BOT_ENV_FILE:-/opt/rawrter-tg-bot/.env}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(async r=>{if(!r.ok||(await r.json()).status!=='ok')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Preserve production workaround; not a guarantee of Telegram availability.
    extra_hosts:
      - "api.telegram.org:${TELEGRAM_API_IP:-149.154.167.220}"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: 0.50
    networks:
      - default
      - orr-internal
networks:
  orr-internal:
    external: true
    name: orr_default
